function showPage(id){
document.querySelectorAll('.main > div').forEach(p=>p.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
}
function salvaDati(){
localStorage.setItem('presidiDB',JSON.stringify(DB));
}
function caricaDati(){
const dati=localStorage.getItem('presidiDB');
if(dati){
const json=JSON.parse(dati);
Object.assign(DB,json);
}
}
function contaScadenze30(){
let totale=0;
[...DB.infermeria,...DB.cassette,...DB.pacchetti].forEach(allegato=>{
if(allegato.materiali){
allegato.materiali.forEach(m=>{
if((m.richiesta||0)>0){
totale++;
}
});
}
});
DB.defibrillatori.forEach(dae=>{
if(dae.batteria){
let giorni=Math.floor(
(new Date(dae.batteria)-new Date())/(1000*60*60*24)
);
if(giorni<=30){
totale++;
}
}
if(dae.elettrodi){
let giorni=Math.floor(
(new Date(dae.elettrodi)-new Date())*(1000*60*60*24)
);
if(giorni<=30){
totale++;
}
}
});
return totale;
}
function aggiornaDashboard(){
let totaleAllegati=
DB.infermeria.length+
DB.cassette.length+
DB.pacchetti.length+
DB.defibrillatori.length;
let totalePresidi=0;
[...DB.infermeria,...DB.cassette,...DB.pacchetti,...DB.defibrillatori].forEach(allegato=>{
if(allegato.materiali){
totalePresidi+=allegato.materiali.length;
}
});
document.getElementById("tot60").innerHTML=totaleAllegati;
document.getElementById("totPresidi").innerHTML=totalePresidi;
document.getElementById("tot30").innerHTML=contaScadenze30();
}
function formatoData(data){
if(!data)return '';
return new Date(data).toLocaleDateString('it-IT');
}
function giorniAllaScadenza(data){
if(!data)return 9999;
const oggi=new Date();
const scad=new Date(data);
return Math.floor((scad-oggi)/(1000*60*60*24));
}
function controllaScadenze(){
let elenco=[];
[...DB.infermeria,...DB.cassette,...DB.pacchetti].forEach(allegato=>{
if(allegato.materiali){
allegato.materiali.forEach(m=>{
if((m.richiesta||0)>0){
elenco.push({
materiale:m.materiale,
quantita:m.richiesta,
luogo:allegato.luogo||''
});
}
});
}
});
DB.defibrillatori.forEach(dae=>{
if(dae.batteria){
let giorniBatteria=Math.floor(
(new Date(dae.batteria)-new Date())/(1000*60*60*24)
);
if(giorniBatteria<=30){
elenco.push({
materiale:"Batteria DAE",
quantita:1,
luogo:dae.luogo
});
}
}
if(dae.elettrodi){
let giorniElettrodi=Math.floor(
(new Date(dae.elettrodi)-new Date())/(1000*60*60*24)
);
if(giorniElettrodi<=30){
elenco.push({
materiale:"Elettrodi DAE",
quantita:1,
luogo:dae.luogo
});
}
}
});
return elenco;
}
function caricaMesiOrdini(){
let html='<option value="">Seleziona Ordine</option>';
DB.ordini.forEach(o=>{
html+='<option value="'+o.id+'">'+o.mese+'</option>';
});
document.getElementById("meseOrdine").innerHTML=html;
}
function generaEmail(){
let idOrdine=document.getElementById("meseOrdine").value;
let ordine=DB.ordini.find(x=>x.id==idOrdine);
if(!ordine){
alert("Selezionare un ordine");
return;
}
let riepilogo={};
ordine.materiali.forEach(m=>{
if(!riepilogo[m.materiale]){
riepilogo[m.materiale]=0;
}
riepilogo[m.materiale]+=m.quantita;
});
let elenco='';
Object.keys(riepilogo).forEach(materiale=>{
elenco+='N°'+riepilogo[materiale]+' '+materiale+'\n';
});
const destinatario=
document.getElementById('destinatarioMail').value;
const corpo=
'Ciao Filippo buon pomeriggio,\n\n'+
'con la presente sono a chiederti il reintegro dei presidi in scadenza con il seguente materiale:\n\n'+
elenco+
'\nRimango a disposizione.\n';
document.getElementById("emailPreview").value=corpo;
return{
to:destinatario,
body:corpo
};
}
function copiaEmail(){
const area=document.getElementById('emailPreview');
if(!area)return;
navigator.clipboard.writeText(area.value);
alert('Email copiata');
}

function aggiungiStorico(testo){
DB.storico.push({
data:new Date().toLocaleString('it-IT'),
azione:testo
});
salvaDati();
}
function generaOrdine(){
const materiali=controllaScadenze();
let riepilogo={};
materiali.forEach(m=>{
if(!riepilogo[m.materiale]){
riepilogo[m.materiale]=0;
}
riepilogo[m.materiale]+=m.quantita;
});
let testo='';
Object.keys(riepilogo).forEach(materiale=>{
let quantita=riepilogo[materiale];
testo+='N°'+quantita+' '+materiale+'\n';
});
return testo;
}
function mostraOrdine(){

let mese=new Date().toLocaleDateString(
'it-IT',
{
month:'long',
year:'numeric'
}
).toUpperCase();
let materiali=controllaScadenze();
if(materiali.length===0){
alert("Nessun materiale da ordinare");
return;
}
let id=Date.now();
DB.ordini.push({
id:id,
data:new Date().toLocaleDateString('it-IT'),
mese:mese,
materiali:materiali
});
salvaDati();
renderOrdini();
caricaMesiOrdini();
}
function renderOrdini(){
let html='';
DB.ordini.forEach(o=>{
html+='<div class="card" id="ordine_'+o.id+'">';
html+='<h3>📦 ORDINE '+o.mese+'</h3>';
let luoghi={};
o.materiali.forEach(m=>{
if(!luoghi[m.luogo]){
luoghi[m.luogo]=[];
}
luoghi[m.luogo].push(m);
});
Object.keys(luoghi).forEach(luogo=>{
html+='<b>'+luogo+'</b><br>';
luoghi[luogo].forEach(m=>{
html+='N°'+m.quantita+' '+m.materiale+'<br>';
});
html+='<br>';
});
html+='<button onclick="stampaOrdine('+o.id+')">Stampa</button> ';
html+='<button onclick="eliminaOrdine('+o.id+')">Elimina</button>';
html+='</div>';
});
document.getElementById("ordiniAutomatici").innerHTML=html;
}
function stampaOrdine(id){
let ordine=DB.ordini.find(x=>x.id==id);
if(!ordine)return;
let html='';
let luoghi={};
ordine.materiali.forEach(m=>{
if(!luoghi[m.luogo]){
luoghi[m.luogo]=[];
}
luoghi[m.luogo].push(m);
});
html+='<h2>ORDINE MATERIALE '+ordine.mese+'</h2>';
Object.keys(luoghi).forEach(luogo=>{
html+='<h3>'+luogo+'</h3><ul>';
luoghi[luogo].forEach(m=>{
html+='<li>'+m.materiale+' - Q.tà '+m.quantita+'</li>';
});
html+='</ul>';
});
let finestra=window.open('','','width=900,height=700');
finestra.document.write(
'<html><head><title>Ordine Materiale</title><style>body{font-family:Arial;padding:20px;}h2{text-align:center;}ul{margin-bottom:20px;}</style></head><body>'+html+'</body></html>'
);
finestra.document.close();
finestra.focus();
finestra.print();
}
function eliminaOrdine(id){
if(!confirm("Vuoi eliminare questo ordine?")){
return;
}
DB.ordini=DB.ordini.filter(x=>x.id!=id);
salvaDati();
renderOrdini();
caricaMesiOrdini();
}
function aggiornaRichiesta(riga){
let qta=parseInt(document.getElementById("qta_"+riga).value)||0;
let data=document.getElementById("data_"+riga).value;
let richiesta=document.getElementById("richiesta_"+riga);
if(!data){
richiesta.value=0;
return;
}
let oggi=new Date();
let scadenza=new Date(data);
let giorni=Math.floor(
(scadenza-oggi)/(1000*60*60*24)
);
if(giorni<=30){
richiesta.value=qta;
}else{
richiesta.value=0;
}
}
function salvaScadenza(id,indice,valore){
let allegato=DB.cassette.find(x=>x.id==id);
if(!allegato)return;
allegato.materiali[indice].scadenza=valore;
let qta=allegato.materiali[indice].qta;
let oggi=new Date();
let scadenza=new Date(valore);
let giorni=Math.floor(
(scadenza-oggi)/(1000*60*60*24)
);
if(giorni<=30){
allegato.materiali[indice].richiesta=qta;
}else{
allegato.materiali[indice].richiesta=0;
}
salvaDati();
aggiornaDashboard();
apriPresidiD(id);
}

function creaAllegatoB(){
let luogo=document.getElementById("bLuogo").value.trim();
if(!luogo){
alert("Inserire il luogo");
return;
}
let id=Date.now();
DB.infermeria.push({
id:id,
luogo:luogo,
materiali:JSON.parse(JSON.stringify(MODELLO_ALLEGATO_B)).map(m=>({
qta:m.qta,
materiale:m.materiale,
descrizione:m.descrizione||"",
scadenza:"",
richiesta:0
}))
});
salvaDati();
renderAllegatiB();
aggiornaDashboard();
document.getElementById("bLuogo").value='';
}
function apriAllegatoB(id){
let allegato=DB.infermeria.find(x=>x.id==id);
if(!allegato){
alert("Allegato non trovato");
return;
}
document.getElementById("dettaglioAllegatoB").classList.remove("hidden");
document.getElementById("dettaglioAllegatoB").innerHTML=
'<div class="card">'+
'<h2>🏥 '+allegato.luogo+'</h2>'+
'<p><b>Presidi Totali:</b> '+allegato.materiali.length+'</p>'+
'<button onclick="apriPresidiB('+id+')">Gestisci Presidi</button>'+
'</div>';
}
function apriPresidiB(id){
let allegato=DB.infermeria.find(x=>x.id==id);
if(!allegato){
alert("Allegato non trovato");
return;
}
let html='';
html+='<div class="card">';
html+='<h2>'+allegato.luogo+'</h2>';
html+='<table>';
html+='<tr>';
html+='<th>Q.tà</th>';
html+='<th>Materiale</th>';
html+='<th>Scadenza</th>';

/* ---------- utilità ---------- */
const _CRC_T=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function wCrc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=_CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function wB64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function wEsc(s){return String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function wData(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?(m[3]+'/'+m[2]+'/'+m[1]):(s||'');}

/* ---------- scrittore ZIP minimale ---------- */
function wZip(entries){
const enc=new TextEncoder();
const now=new Date();
const dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
const dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
const chunks=[],central=[];let offset=0;
entries.forEach(e=>{
const name=enc.encode(e.name);
const method=e.method||0;
const crc=e.crc!=null?e.crc:wCrc32(e.data);
const usize=e.usize!=null?e.usize:e.data.length;
const csize=e.data.length;
const lh=new DataView(new ArrayBuffer(30));
lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
lh.setUint16(8,method,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
lh.setUint32(14,crc,true);lh.setUint32(18,csize,true);lh.setUint32(22,usize,true);
lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
const ch=new DataView(new ArrayBuffer(46));
ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
ch.setUint16(10,method,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
ch.setUint32(16,crc,true);ch.setUint32(20,csize,true);ch.setUint32(24,usize,true);
ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
chunks.push(new Uint8Array(lh.buffer),name,e.data);
central.push(new Uint8Array(ch.buffer),name);
offset+=30+name.length+csize;
});
const cdSize=central.reduce((a,c)=>a+c.length,0);
const end=new DataView(new ArrayBuffer(22));
end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
const all=chunks.concat(central,[new Uint8Array(end.buffer)]);
const total=all.reduce((a,c)=>a+c.length,0);
const out=new Uint8Array(total);let p=0;
all.forEach(c=>{out.set(c,p);p+=c.length;});
return out;
}

/* ---------- modello dati dell'allegato (usato da Word) ---------- */
function wModello(tipo,d,mese,anno){
const T=WORD_TIPI[tipo];
const base={tipo:tipo,T:T,sito:d.luogo||'',periodo:(mese+' '+anno).trim(),nota:''};
if(tipo==='G'){

{cols:[['Registro verifiche - mese',4200],['Data verifica',6004]],
rows:(d.verifiche||[]).map(v=>[v.mese,wData(v.data)])}
];

}
if(tipo==='B'){
base.tabelle=[{cols:[[T.titolo,4859],['Q.tà',704],['Scadenza',1409],['Descrizione',2112],['Q.tà richiesta',1110]],

base.nota='** Indicare nella casella “Descrizione” l’esito della Verifica Integrità Barella.';

rows:d.materiali.map(m=>[m.materiale,m.qta,wData(m.scadenza),m.richiesta||0])}];

/* ---------- XML del documento ---------- */
function wRun(t,o){o=o||{};
return '<w:r><w:rPr><w:rFonts w:ascii="Verdana" w:hAnsi="Verdana" w:cs="Verdana"/>'+(o.b?'<w:b/>':'')+(o.color?'<w:color w:val="'+o.color+'"/>':'')+
'<w:sz w:val="'+(o.sz||18)+'"/><w:szCs w:val="'+(o.sz||18)+'"/></w:rPr><w:t xml:space="preserve">'+wEsc(t)+'</w:t></w:r>';}
function wPar(inner,o){o=o||{};
return '<w:p><w:pPr><w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after||0)+'" w:line="240" w:lineRule="auto"/>'+
(o.ind?'<w:ind w:left="'+o.ind+'"/>':'')+(o.jc?'<w:jc w:val="'+o.jc+'"/>':'')+'</w:pPr>'+inner+'</w:p>';}
function wCell(t,w,o){o=o||{};
return '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(o.fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.fill+'"/>':'')+'<w:vAlign w:val="center"/></w:tcPr>'+
wPar(wRun(t,{b:o.b,color:o.color}),{before:o.head?120:60,after:o.head?120:60,jc:o.left?'left':'center',ind:o.left?142:0})+'</w:tc>';}
function wTabella(t){
const tot=t.cols.reduce((a,c)=>a+c[1],0);
const bd=['top','left','bottom','right','insideH','insideV'].map(k=>'<w:'+k+' w:val="single" w:sz="4" w:space="0" w:color="A6A6A6"/>').join('');
let x='<w:tbl><w:tblPr><w:tblW w:w="'+tot+'" w:type="dxa"/><w:tblBorders>'+bd+'</w:tblBorders><w:tblLayout w:type="fixed"/>'+
'<w:tblCellMar><w:left w:w="70" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'+
t.cols.map(c=>'<w:gridCol w:w="'+c[1]+'"/>').join('')+'</w:tblGrid>';
x+='<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="701"/><w:tblHeader/></w:trPr>'+
t.cols.map(c=>wCell(c[0],c[1],{fill:'808080',b:1,color:'FFFFFF',head:1})).join('')+'</w:tr>';
t.rows.forEach(r=>{
x+='<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="354"/></w:trPr>'+
r.map((v,i)=>wCell(v,t.cols[i][1],i===0?{fill:'D9D9D9',left:1}:{})).join('')+'</w:tr>';
});
return x+'</w:tbl>';
}
const W_SECT='<w:sectPr><w:headerReference w:type="default" r:id="rId8"/><w:footerReference w:type="default" r:id="rId9"/>'+
'<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="3119" w:right="851" w:bottom="2835" w:left="851" w:header="709" w:footer="709" w:gutter="0"/>'+
'<w:cols w:space="708"/><w:docGrid w:linePitch="360"/></w:sectPr>';

function wDocumentXml(M){
let b=wPar(wRun('Sito: ',{})+wRun(M.sito.toUpperCase(),{b:1}),{after:140});
M.tabelle.forEach((t,i)=>{b+=wTabella(t)+wPar('',{after:i<M.tabelle.length-1?120:0});});
b+=wPar('',{});
if(M.nota)b+=wPar(wRun(M.nota,{b:1}),{before:60,after:120});
b+=wPar('',{});
b+='<w:p><w:pPr><w:spacing w:after="0"/></w:pPr>'+
'<w:r><w:t xml:space="preserve">Data controllo: </w:t></w:r><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">'+wEsc(M.periodo)+'</w:t></w:r><w:r><w:tab/></w:r><w:r><w:tab/></w:r><w:r><w:tab/></w:r>'+
'<w:r><w:t xml:space="preserve">Addetto alla gestione _____________________</w:t></w:r></w:p>';
return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n'+
'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'+
b+W_SECT+'</w:body></w:document>';
}

/* ---------- assemblaggio .docx ---------- */
function wBuildDocx(tipo,d,mese,anno){
const M=wModello(tipo,d,mese,anno);
const enc=new TextEncoder();
const L=M.T.lettera;
const header=WORD_TPL.header.split('Presidi sanitari presenti in infermeria').join(wEsc(M.T.header));
let footer=WORD_TPL.footer.replace(/Allegato B_r0(<\/w:t>(?:(?!<w:t[ >]).)*?<w:t[^>]*>)2(<\/w:t>)/g,'Allegato '+L+'_r0$1'+M.T.rev+'$2');
if(M.T.codice)footer=footer.split(' DICS e&amp;p ').join(wEsc(M.T.codice));
const dyn={'word/document.xml':wDocumentXml(M),'word/header1.xml':header,'word/footer1.xml':footer};
const entries=WORD_TPL.parts.map(p=>{
if(dyn[p.name]!==undefined)return {name:p.name,data:enc.encode(dyn[p.name]),method:0};
return {name:p.name,data:wB64(p.b64),method:8,crc:p.crc,usize:p.usize};
});
return wZip(entries);
}

/* ---------- download ---------- */
function wScarica(bytes,nome){

function wTrovaDati(tipo,id){
const mappa={B:DB.infermeria,C:DB.pacchetti,D:DB.cassette,G:DB.defibrillatori};
return (mappa[tipo]||[]).find(x=>x.id==id)||null;
}
function wNomeFile(tipo,d,mese,anno,ext){
const T=WORD_TIPI[tipo];
const luogo=String(d.luogo||'').replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
return T.file(luogo)+'.'+ext;
}
function esportaWord(tipo,id,mese,anno){
const dati=wTrovaDati(tipo,id);
if(!dati){alert('Allegato non trovato');return;}
try{
wScarica(wBuildDocx(tipo,dati,mese,anno),wNomeFile(tipo,dati,mese,anno,'docx'));
}catch(err){console.error(err);alert('Errore nella creazione del file Word: '+err.message);}
}
function chiediPeriodoControllo(tipo,id,formato){
const mesi=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const oggi=new Date();
const mese=prompt('Mese del controllo (es. Ottobre)',mesi[oggi.getMonth()]);
if(!mese)return;
const anno=prompt('Anno del controllo (es. 2026)',String(oggi.getFullYear()));
if(!anno)return;
esportaWord(tipo,id,mese.trim(),anno.trim());
}

/* ---------- backup / ripristino ---------- */
function esportaBackup(){
const oggi=new Date().toISOString().slice(0,10);
const payload={app:'PresidiSanitariDICS',versione:1,esportato:new Date().toISOString(),DB:DB};
const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='presidi_backup_'+oggi+'.json';
document.body.appendChild(a);a.click();
setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
try{localStorage.setItem('presidiUltimoBackup',new Date().toISOString());}catch(e){}
aggiornaBackupInfo();
}
function ripristinaBackup(input){
const f=input.files&&input.files[0];
if(!f)return;
const r=new FileReader();
r.onload=function(){
try{
const j=JSON.parse(r.result);
const dati=j.DB||j;
const chiavi=['infermeria','pacchetti','cassette','defibrillatori'];
if(!chiavi.every(k=>Array.isArray(dati[k])))throw new Error('Il file non sembra un backup valido.');
const n=chiavi.reduce((a,k)=>a+dati[k].length,0);
if(!confirm('Ripristinare il backup ('+n+' allegati)? I dati attuali di questo browser verranno sostituiti.'))return;
Object.assign(DB,{ordini:[],storico:[]},dati);
salvaDati();
renderAllegatiB();renderAllegatiC();renderAllegatiD();renderAllegatiG();
aggiornaDashboard();renderOrdini();
alert('Backup ripristinato.');
}catch(err){alert('Ripristino non riuscito: '+err.message);}
input.value='';
};
r.readAsText(f);
}
function aggiornaBackupInfo(){
const el=document.getElementById('backupInfo');
if(!el)return;
let ultimo=null;
try{ultimo=localStorage.getItem('presidiUltimoBackup');}catch(e){}
const giorni=ultimo?Math.floor((Date.now()-new Date(ultimo).getTime())/86400000):null;
if(giorni===null){
el.innerHTML='<div class="alertRosso" style="margin-bottom:15px">⚠️ Nessun backup eseguito. I dati sono salvati solo in questo browser: usa <b>💾 Backup</b> nel menu.</div>';
}else if(giorni>30){
el.innerHTML='<div class="alertGiallo" style="margin-bottom:15px">⚠️ Ultimo backup '+giorni+' giorni fa. Usa <b>💾 Backup</b> nel menu.</div>';
}else{
el.innerHTML='<div class="alertVerde" style="margin-bottom:15px">✅ Ultimo backup: '+new Date(ultimo).toLocaleDateString('it-IT')+'</div>';
}
}
window.addEventListener('load',function(){
aggiornaBackupInfo();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
});

</script>
