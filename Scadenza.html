const mesi = {
  gennaio: 1,
  febbraio: 2,
  marzo: 3,
  aprile: 4,
  maggio: 5,
  giugno: 6,
  luglio: 7,
  agosto: 8,
  settembre: 9,
  ottobre: 10,
  novembre: 11,
  dicembre: 12
};
function confrontaTitoli(a,b){

 let ta=(a.titolo||"").trim().toLowerCase();
 let tb=(b.titolo||"").trim().toLowerCase();

 let meseA=mesi[ta];
 let meseB=mesi[tb];

 // entrambi sono mesi
 if(meseA && meseB){
   return meseA-meseB;
 }

 // solo A è un mese
 if(meseA){
   return -1;
 }

 // solo B è un mese
 if(meseB){
   return 1;
 }

 // entrambi non sono mesi
 return ta.localeCompare(tb,"it",{sensitivity:"base"});
}
function saveData(){
localStorage.setItem(
"pages",
JSON.stringify(pages)
);
}
function showHome(){

let paginaSelezionata = pages.length ? pages[0] : null;

let nomeTitolo =
paginaSelezionata?.nomeTitolo || "Titolo";

let nomeDescrizione =
paginaSelezionata?.nomeDescrizione || "Descrizione";

let html=`

<div style="position:relative;margin-bottom:20px;">
 <button onclick="printDashboard()" style="position:absolute;left:0;top:0;">
 🖨️ Stampa Scadenze
 </button>
 <h2 style="text-align:center;">Dashboard Scadenze</h2>
</div>

<div class="card">

<h3>Nuovo Controllo</h3>

${
pages.length
?
`<select id="pageSelect"
onchange="aggiornaCampiHome();aggiornaMenu();renderCampiExtra();">

${pages.map(p=>`<option>${p.name}</option>`).join("")}

</select>`
:
`<div class="card scaduto">
Nessuna verifica creata
</div>`
}

<label id="lblTitolo">${nomeTitolo}</label>
<input id="titolo" list="titoliList" placeholder="${nomeTitolo}">
<datalist id="titoliList"></datalist>

<label id="lblDescrizione">${nomeDescrizione}</label>
<input id="descrizione" list="descrizioniList" placeholder="${nomeDescrizione}">
<datalist id="descrizioniList"></datalist>

<div id="campiExtra"></div>

<label>Data Controllo</label>
<input id="dataControllo" type="date">

<label>Prossima Scadenza</label>
<input id="dataScadenza" type="date">

<button onclick="quickInsert()">
Salva Controllo
</button>

</div>

<h3>🔴 Scaduti</h3>
<div class="cardsGrid">
`;

let today=new Date();

pages.forEach(p=>{
 p.records.forEach((r,index)=>{

  if(r.nascostoDashboard) return;
  if(!r.dataScadenza) return;

  let diff=Math.ceil(
   (new Date(r.dataScadenza)-today)/86400000
  );

  if(diff<0){

   html+=`
   <div class="card scaduto">

   <h3>${p.name}</h3>

   <b>${r.titolo||"-"}</b><br>
   ${r.descrizione||"-"}<br>

   Controllata:
   ${r.dataControllo ? formattaData(r.dataControllo) : "-"}<br>

   Scadenza:
   ${r.dataScadenza ? formattaData(r.dataScadenza) : "-"}<br>

   Scaduta da ${Math.abs(diff)} giorni

   <br><br>

   <button onclick="editRecord('${p.name}',${index})">
   ✏️ Modifica
   </button>

   <button onclick="nascondiDashboard('${p.name}',${index})">
   ✅ Archivia
   </button>

   </div>
   `;
  }
 });
});

html+=`
</div>

<h3>🟡 In scadenza entro 15 giorni</h3>

<div class="cardsGrid">
`;

pages.forEach(p=>{
 p.records.forEach((r,index)=>{

  if(!r.dataScadenza) return;

  let diff=Math.ceil(
   (new Date(r.dataScadenza)-today)/86400000
  );

   html+=`

   <h3>${p.name}</h3>

   `;
  }

});

renderCampiExtra();
aggiornaCampiHome();
}
function formattaData(data){
 if(!data)return "";
 let [anno,mese,giorno]=data.split("-");
 return `${giorno}/${mese}/${anno}`;
}
function invertiData(data){
 if(!data)return "";
 let parti=data.split("/");
 if(parti.length!==3)return data;
 return `${parti[2]}-${parti[1]}-${parti[0]}`;
}
function aggiornaMenu(){

 let pagina=document.getElementById("pageSelect")?.value;
 if(!pagina)return;

 let p=pages.find(x=>x.name===pagina);
 if(!p)return;

 let titoli=[...new Set(p.records.map(r=>r.titolo).filter(Boolean))];
 let descrizioni=[...new Set(p.records.map(r=>r.descrizione).filter(Boolean))];

 document.getElementById("titoliList").innerHTML =
  titoli.sort().map(t=>`<option value="${t}">`).join("");

 document.getElementById("descrizioniList").innerHTML =
  descrizioni.sort().map(d=>`<option value="${d}">`).join("");

 document.getElementById("titolo").value = "";
 document.getElementById("descrizione").value = "";
}
function quickInsert(){

 let page=document.getElementById("pageSelect").value;

 let titolo=document.getElementById("titolo").value.trim();
 let descrizione=document.getElementById("descrizione").value.trim();
 let dataControllo=document.getElementById("dataControllo").value;
 let dataScadenza=document.getElementById("dataScadenza").value;

 let p=pages.find(x=>x.name===page);

 let valoriExtra={};

 (p.colonneExtra || []).forEach(nome=>{

  let campo=document.getElementById(
   "extra_" + nome
  );

  valoriExtra[nome]=campo ? campo.value.trim() : "";

 });

 let precedente=p.records.find(
  r=>r.descrizione===descrizione && descrizione!=""
 );

 if(precedente){

  if(!confirm(
`Esiste già una verifica con questa descrizione.

Ultima scadenza: ${formattaData(precedente.dataScadenza)}

Vuoi aggiungere una NUOVA scadenza mantenendo lo storico?`
  )) return;

 }

 p.records.push({

  titolo:titolo||"",

  descrizione:descrizione||"",

  dataControllo:dataControllo||"",

  dataScadenza:dataScadenza||"",

  nascostoDashboard:false,

  extra:valoriExtra

 });

 saveData();

 showHome();

}
function deleteRecord(pageName,index){

 if(!confirm("Vuoi eliminare questa scadenza?"))return;

 let page=pages.find(p=>p.name===pageName);

 page.records.splice(index,1);

 saveData();
 showHome();

}
function editRecord(pageName,index){

 let page=pages.find(p=>p.name===pageName);
 let record=page.records[index];

 let titolo=prompt("Titolo",record.titolo||"");
 if(titolo===null)return;

 let descrizione=prompt("Descrizione",record.descrizione||"");
 if(descrizione===null)return;

 let dataControllo=prompt("Data Controllo (gg/mm/aaaa)",formattaData(record.dataControllo));
 if(dataControllo===null)return;

 let dataScadenza=prompt("Data Scadenza (gg/mm/aaaa)",formattaData(record.dataScadenza));
 if(dataScadenza===null)return;

 record.titolo=titolo;
 record.descrizione=descrizione;
 record.dataControllo=invertiData(dataControllo);
 record.dataScadenza=invertiData(dataScadenza);

 saveData();
 showHome();

}
function createPage(){

 let name=document.getElementById("newPageName").value.trim();
 if(!name) return;

 let nomeTitolo =
 prompt("Nome della prima colonna","Titolo") || "Titolo";

 let nomeDescrizione =
 prompt("Nome della seconda colonna","Descrizione") || "Descrizione";

 let numColonne =
 parseInt(document.getElementById("newColumns").value) || 0;

 let colonneExtra=[];

 for(let i=1;i<=numColonne;i++){

  let nome=
  prompt(`Nome colonna aggiuntiva ${i}`);

  if(!nome){
   colonneExtra.push(`Colonna ${i}`);
   continue;
  }

  nome=nome.trim();

  let vietate=[
   nomeTitolo.toLowerCase(),
   nomeDescrizione.toLowerCase(),
   "data controllo",
   "data scadenza",
   "stato",
   "azioni"
  ];

  if(vietate.includes(nome.toLowerCase())){
   alert(`"${nome}" è una colonna già presente.`);
   i--;
   continue;
  }

  colonneExtra.push(nome);
 }

 pages.push({
  name:name,
  records:[],
  nomeTitolo:nomeTitolo,
  nomeDescrizione:nomeDescrizione,
  colonneExtra:colonneExtra
 });

 saveData();
 renderMenu();
 showHome();

 document.getElementById("newPageName").value="";
 document.getElementById("newColumns").value=0;
}
function renderMenu(){

 let html="";

 pages.forEach((p,i)=>{
  html+=`
  <div class="menuItem" onclick="openPage(${i})">
   ${p.name}
  </div>
  `;
 });

 document.getElementById("pagesList").innerHTML=html;

}
function openPage(i){

 let p = pages[i];

 let records = p.records
 .map((r,index)=>({...r,realIndex:index}))
 .sort((a,b)=>

  confrontaTitoli(a,b) ||

  (a.descrizione||"").localeCompare(
   (b.descrizione||""),
   "it",
   {sensitivity:"base"}
  ) ||

  (a.dataScadenza||"9999-12-31").localeCompare(
   b.dataScadenza||"9999-12-31"
  )

 );

 let today = new Date();

 let html = `

 <div style="position:relative;margin-bottom:20px;height:80px;">

   ${logoEni ? `<img srci}` : ""}

   <div class="pageTitle" style="text-align:center;line-height:80px;">
     ${p.name}
   </div>

 </div>

 <table>

 <tr>
   <th>${p.nomeTitolo || "Titolo"}</th>
   <th>${p.nomeDescrizione || "Descrizione"}</th>

   ${(p.colonneExtra || [])
     .map(c=>`<th>${c}</th>`)
     .join("")}

   <th>Data Controllo</th>
   <th>Data Scadenza</th>
   <th>Stato</th>
   <th class="noPrint">Azioni</th>
 </tr>

 `;

 records.forEach(r=>{

  let diff = r.dataScadenza
  ? Math.ceil((new Date(r.dataScadenza)-today)/86400000)
  : 9999;

  let stato =
  diff < 0
  ? `Scaduta da ${Math.abs(diff)} giorni`
  : diff <= 15
  ? `Scade tra ${diff} giorni`
  : "OK";

  let colore =
  diff < 0
  ? "#d10000"
  : diff <= 15
  ? "#ff9900"
  : "#008542";

  html += `

  <tr>

   <td>${r.titolo || ""}</td>

   <td>${r.descrizione || ""}</td>

   ${(p.colonneExtra || [])
    .map(c=>`<td>${r.extra?.[c] || ""}</td>`)
    .join("")}

   <td>${r.dataControllo ? formattaData(r.dataControllo) : ""}</td>

   <td>${r.dataScadenza ? formattaData(r.dataScadenza) : ""}</td>

   <td style="color:${colore};font-weight:bold;">
    ${stato}
   </td>

   <td class="noPrint">
    <button onclick="editRecord('${p.name}',${r.realIndex})">✏️</button>
    <button onclick="deleteRecord('${p.name}',${r.realIndex})">🗑️</button>
   </td>

  </tr>

  `;
 });
 html += `
 </table>
 <br>
<button onclick="printPage(${i})">🖨️ Stampa Tabella</button>
<button onclick="deletePage(${i})"> 🗑️ Cancella Pagina</button>
 `;
 document.getElementById("content").innerHTML = html;
}
function deletePage(index){

 if(!confirm(`Vuoi eliminare definitivamente la verifica "${pages[index].name}" e tutti i controlli contenuti?`))return;

 pages.splice(index,1);

 saveData();
 renderMenu();
 showHome();

}

function printDashboard(){
 let oggi=new Date();
 let html=`
 <html>
 <head>

 <title>Stampa Scadenze</title>

 <style>
 body{
  font-family:Arial;
  padding:20px;
 }

 h2{
  text-align:center;
 }

 .scaduto{
  border-left:5px solid red;

 }

 .scadenza{
  border-left:5px solid orange;
  padding:8px;
  margin-bottom:8px;
 }
 </style>

 </head>

 <body>

 <h2>Dashboard Scadenze</h2>

 <h3>🔴 Scaduti</h3>
 `;

 pages.forEach(p=>{

  p.records.forEach(r=>{

   if(r.nascostoDashboard) return;

   if(!r.dataScadenza) return;

   let diff=Math.ceil(
    (new Date(r.dataScadenza)-oggi)/86400000
   );

   if(diff<0){

    html+=`

    </div>
    `;
   }

  });

 });

 html+=`<h3>🟡 In scadenza entro 15 giorni</h3>`;

 pages.forEach(p=>{

  p.records.forEach(r=>{

   if(r.nascostoDashboard) return;

   if(!r.dataScadenza) return;

   let diff=Math.ceil(
    (new Date(r.dataScadenza)-oggi)/86400000
   );

   if(diff>=0 && diff<=15){

    `;
   }

  });

 });
