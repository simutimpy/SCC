<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Home GST</title>
<style>
body {
  margin:0;
  font-family: Arial;
}
.container {
  display:flex;
  height:100vh;
}
.box {
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}
/* colori */
.personale { background:#003a8f; }
.mezzi { background:#16a34a; }
.attrezzature { background:#f59e0b; }
.box:hover {
  opacity:0.9;
}
</style>
</head>
<body>
<div onclick="goExternalHome()"
     style=" position: fixed; top: 20px; left: 50%; transform: translateX(-50%); cursor: pointer; z-index: 9999; ">
    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="black" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
</div>
<div class="container">
  <div class="box personale" onclick="goPersonale()">
    Controllo Personale
  </div>

  <div class="box mezzi" onclick="goMezzi()">
    Controllo Mezzi
  </div>

  <div class="box attrezzature" onclick="goAttrezzature()">
    Controllo Attrezzature
  </div>
</div>
<script>
function goPersonale(){
  window.location.href = "Ditte.html";
}

function goMezzi(){
  window.location.href = "Mezzi.html";
}

function goAttrezzature(){
  window.location.href = "attrezzature.html";
}
function goExternalHome() { location.href = "scc ridotto.html";}
</script>
</body>
</html>
