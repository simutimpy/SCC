            filteredKeys.forEach(key => {
                const data = lavorazioni[key];
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="card" onclick="toggleCard(this)">
                        <div class="card-header">
                            <span>${key}.</span> ${data.titolo} <span class="arrow">></span>
                        </div>
                        <div class="card-content">
                            <div class="detail-section">
                                <h4>A. Breve descrizione dell’attività</h4>
                                <p class="detail-text">${data.A}</p>
                            </div>
                            <div class="detail-section">
                                <h4>B. Rischi dell’attività</h4>
                                <ul class="detail-list risk">
                                    ${data.B.split(';').map(item => `<li>${item.trim()}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="detail-section">
                                <h4>C. Possibili non conformità + articoli 81/08</h4>
                                <ul class="detail-list non-conformity">
                                    ${data.C.split(';').map(item => `<li>${item.trim()}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="detail-section">
                                <h4>D. Sintesi norme violate (Prevenzione)</h4>
                                <p class="detail-text prevention">${data.D}</p>
                            </div>
                        </div>
                    </div>
                `;
                lavorazioniList.appendChild(li);
            });
        }
 
        function toggleCard(card) {
            const content = card.querySelector('.card-content');
            const header = card.querySelector('.card-header');
            if (content.style.display === "block") {
                content.style.display = "none";
                header.classList.remove('open');
            } else {
                content.style.display = "block";
                header.classList.add('open');
            }
        }
 
        searchInput.addEventListener('keyup', (e) => {
            renderLavorazioni(e.target.value);
        });
 
        // Inizializza la visualizzazione
        renderLavorazioni();
