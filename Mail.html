.footer {
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:12px;
  color:#666;
}
/* HEADER */
.topbar {
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items:center;
  margin-bottom:20px;
}
.left {
  text-align:left;
}
.center {
  text-align:center;
}
.right {
  text-align:right;
}
/* icona */
.homeIcon {
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.dataSmall {
  width: 180px;
  max-width: 100%;
  display: block;   /* ✅ AGGIUNGI QUESTO */
}
label {
  display: block;
  margin-top: 8px;
}
/* titolo centrato */
.titleCenter {
  text-align:center;
  margin:0;
}
h1, h2 {
  margin:0;
  color:#1f2d3d;
}
/* CARD */
.cardBox {
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  margin-bottom:15px;
}
/* INPUT */
input, select {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}
/* BUTTON */
button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#0078d4;
  color:white;
  font-weight:bold;
  cursor:pointer;
  width:100%;
}
button:hover {
  background:#005fa3;
}
/* GRID HOME */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:10px; /* ✅ aggiungi questo */
}
.grid button {
  background:#2b88d8;
}
/* TAG DITTE */
.tag {
  display:inline-block;
  background:#0078d4;
  color:white;
  padding:6px 12px;
  border-radius:20px;
  margin:3px;
  font-size:13px;
}
/* COLORI SPECIALI */
.redBox {
  background:#ffe5e5;
  border:2px solid red;
}
.greenBox {
  background:#e6ffe6;
  border:2px solid green;
}
/* OUTPUT */
pre {
  background:#f0f0f0;
  padding:10px;
  border-radius:8px;
  white-space:pre-wrap;
}
/* POPUP */
.popup {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
  display:none;
  z-index:1000;
}
.hidden {
  display: none;
}
.mailBtn {
  margin-bottom: 20px;
}
.card {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}

<script>
function showPopup(msg){
 let pop = document.getElementById("popup");
 pop.innerText = msg;
 pop.style.display = "block";

 setTimeout(()=>{
  pop.style.display = "none";
 },1500);
} 
function goExternalHome(){
 window.location.href = "SCC.html";
}
function formatData(dataISO){
 if(!dataISO) return "";
 
 let parts = dataISO.split("-");
 return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function copiaHTML(idElemento){

  let contenuto = document.getElementById(idElemento);

  if (!contenuto.innerHTML) {
    showPopup("Genera prima il testo!");
    return;
  }

  // ✅ HTML pulito con delimitatori Outlook
  let html = `
  <!--StartFragment-->
  ${contenuto.innerHTML}
  <!--EndFragment-->
  `;

  let text = contenuto.innerText;

  navigator.clipboard.write([
    new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([text], { type: "text/plain" })
    })
  ]);

  showPopup("Copiato ✅ (Outlook FIX)");
}
/* ========================
   MAIL LIST (ORIGINALE)
======================== */
let mailList = [];
window.onload = function () {
 const saved = localStorage.getItem("mailList");
 if (saved) {
   mailList = JSON.parse(saved);
   renderList();
   caricaDitte();
 }
};
let editingIndex = null;
function showMailList() {
 document.getElementById("homePage").classList.add("hidden");
 document.getElementById("mailPage").classList.remove("hidden");
}
function showHome() {
 document.querySelectorAll("body > div").forEach(d=>d.classList.add("hidden"));
 document.getElementById("homePage").classList.remove("hidden");
}
function addItem() {
 const company = document.getElementById("company").value.trim();
 const emails = document.getElementById("emails").value.trim();
 if (!company || !emails) return;

 const emailArray = emails.split(",").map(e => e.trim());

 if (editingIndex !== null) {
  mailList[editingIndex] = { company, emails: emailArray };
  editingIndex = null;
  document.getElementById("addBtn").innerText = "Aggiungi";
 } else {
  mailList.push({ company, emails: emailArray });
 }

 localStorage.setItem("mailList", JSON.stringify(mailList));

 document.getElementById("company").value = "";
 document.getElementById("emails").value = "";

 renderList();
 caricaDitte();
}
function renderList() {
 const listDiv = document.getElementById("list");
 listDiv.innerHTML = "";

 mailList.forEach((item, index) => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
  <div>
    <strong>${item.company}</strong><br>
    <small>${item.emails.join(", ")}</small>
  </div>

  <div class="actions">
    <button class="smallBtn editBtn" onclick="editItem(${index})">✏️</button>
    <button class="smallBtn deleteBtn" onclick="deleteItem(${index})">❌</button>
  </div>
`;
  listDiv.appendChild(div);
 });
}
function editItem(index) {
 const item = mailList[index];
 document.getElementById("company").value = item.company;
 document.getElementById("emails").value = item.emails.join(", ");
 editingIndex = index;
}
function deleteItem(index) {
 mailList.splice(index, 1);
 localStorage.setItem("mailList", JSON.stringify(mailList));
 renderList();
 caricaDitte();
}

let ditteSelezionate = [];
function caricaDitte(){
 const select = document.getElementById("dittaSelect");
 select.innerHTML="";

 mailList.forEach((item,index)=>{
   let opt = document.createElement("option");
   opt.value=index;
   opt.textContent=item.company;
   select.appendChild(opt);
 });
}
function addDitta(){
 const idx=document.getElementById("dittaSelect").value;
 const item = mailList[idx];

 ditteSelezionate.push(item);
 renderDitte();
}
function renderDitte(){
 const cont = document.getElementById("dittaContainer");
 cont.innerHTML="";

 ditteSelezionate.forEach((d,i)=>{
   let span=document.createElement("span");
   span.className="tag";
   span.innerHTML = `${d.company} ❌`;
   span.onclick = ()=>{ditteSelezionate.splice(i,1); renderDitte();}
   cont.appendChild(span);
 });
}

function getCC(area){
