<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archivio SDS</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1a2233;--mut:#667085;--bd:#e3e7ef;--pri:#2f6bff;--pritx:#fff;--ok:#12805c;--okbg:#dcf5ea;--wa:#8a5a00;--wabg:#fff0c2;--wabd:#f5c542;--dn:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mut:#9aa6bd;--bd:#2a3350;--pri:#5b8cff;--pritx:#0b1020;--ok:#5fd6a4;--okbg:#12362b;--wa:#ffd666;--wabg:#4a3a0c;--wabd:#b8921f;--dn:#ff7a7a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mut:#9aa6bd;--bd:#2a3350;--pri:#5b8cff;--pritx:#0b1020;--ok:#5fd6a4;--okbg:#12362b;--wa:#ffd666;--wabg:#4a3a0c;--wabd:#b8921f;--dn:#ff7a7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.4rem;margin:0}h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--mut)}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:1px solid var(--bd);background:var(--card);padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn.p{background:var(--pri);color:var(--pritx);border-color:var(--pri)}.btn.d{color:var(--dn)}.btn.s{padding:7px 11px;font-size:.85rem}
.stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;flex:1;min-width:120px}
.stat b{font-size:1.5rem;display:block}.stat span{color:var(--mut);font-size:.8rem}.stat.w b{color:var(--wa)}
.tools{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:16px}
@media(min-width:700px){.tools{grid-template-columns:2fr 1fr 1fr 1fr}}
.tools input,.tools select,dialog input,dialog textarea,dialog select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.warn{border-color:var(--wabd);background:linear-gradient(var(--wabg),var(--wabg)) top/100% 5px no-repeat,var(--card)}
.card h3{margin:0;font-size:1.1rem}.row{font-size:.9rem}.row i{font-style:normal;color:var(--mut);display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--bg);border:1px solid var(--bd)}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.tag.wa{background:var(--wabg);color:var(--wa);border-color:var(--wabd)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.empty{text-align:center;color:var(--mut);padding:50px 10px;grid-column:1/-1}
dialog{border:none;border-radius:18px;padding:18px;width:min(560px,94vw);background:var(--bg);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{min-height:130px;font-family:ui-monospace,monospace;font-size:.75rem}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.note{font-size:.8rem;color:var(--mut)}
.hd{display:flex;align-items:center;gap:12px}
.home{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--bd);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12);flex:none}
html{height:100%}body{min-height:100%;display:flex;flex-direction:column}.wrap{flex:1;width:100%}
footer{width:100%;margin-top:auto;text-align:center;color:var(--mut);opacity:.7;font-weight:300;font-size:.8rem;letter-spacing:.04em;padding:10px 16px 28px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="hd"><a id="home" class="home" href="#" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></a><h1>Archivio SDS<small>Schede di sicurezza</small></h1></div>
<div><button class="btn" id="bk">Backup</button> <button class="btn p" id="add">+ Nuova scheda</button></div>
</header>
<div class="stats"><div class="stat"><b id="n1">0</b><span>Schede totali</span></div><div class="stat w"><b id="n2">0</b><span>Da ricontrollare</span></div></div>
<div class="tools">
<input id="q" type="search" placeholder="Cerca sostanza, fabbricante, luogo…">
<select id="f"><option value="all">Tutte</option><option value="warn">Da ricontrollare</option><option value="ok">Aggiornate</option></select>
<select id="o"><option value="name">Ordina: nome</option><option value="date">Ordina: data (vecchie prima)</option><option value="place">Ordina: ubicazione</option></select>
<select id="y"><option value="2">Avviso dopo 2 anni</option><option value="3">Avviso dopo 3 anni</option></select>
</div>
<div class="grid" id="list"></div>
</div>

<footer>By Simone Lacognata</footer>

<dialog id="dlg"><form method="dialog" id="frm" onsubmit="return false">
<h2 id="dt" style="margin:0 0 4px">Nuova scheda</h2>
<label>Nome sostanza *</label><input id="fn" required>
<div class="two"><div><label>Versione / revisione</label><input id="fv" placeholder="es. Rev. 5"></div><div><label>Data della scheda *</label><input id="fd" type="date" required></div></div>
<label>Utilizzato per</label><input id="fu">
<label>Dove si trova</label><input id="fp">
<label>Fabbricante</label><input id="fm">
<label>Indirizzo internet (dove cercarla)</label><input id="fw" placeholder="www.fabbricante.it"><div id="pw" hidden><label>PDF della SDS</label><input id="fpdf" type="file" accept="application/pdf,.pdf"><p class="note" id="pn"></p><button type="button" class="btn s d" id="prm" hidden>Scollega PDF</button></div>
<div class="foot"><button type="button" class="btn" id="c1">Annulla</button><button type="button" class="btn p" id="s1">Salva</button></div>
</form></dialog>

<dialog id="bd">
<h2 style="margin:0 0 6px">Backup e ripristino</h2>
<p class="note">I dati sono salvati solo in questo browser: fai backup spesso. Copia il testo qui sotto e conservalo, oppure scarica il file.</p>
<textarea id="bt"></textarea>
<div class="foot"><button class="btn" id="bc">Copia</button><button class="btn" id="bdl">Scarica file</button><label class="btn" style="margin:0;color:var(--tx)">Carica file<input id="bf" type="file" accept=".json,application/json" hidden></label></div>
<p class="note" id="bm"></p>
<div class="foot"><button class="btn d" id="br">Ripristina dal testo (sostituisce tutto)</button><button class="btn" id="bx">Chiudi</button></div>
</dialog>

<script>
var KEY='sds-v1',data=[],yrs=2,editId=null,$=function(i){return document.getElementById(i)};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);data=o.d||[];yrs=o.y||2}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({d:data,y:yrs}))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function age(d){return (Date.now()-new Date(d+'T00:00:00').getTime())/31557600000}
function isWarn(s){return !s.date||age(s.date)>=yrs}
function fmt(d){if(!d)return'—';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function ageTxt(d){var a=age(d);if(a<1){var m=Math.max(0,Math.floor(a*12));return m+(m===1?' mese':' mesi')}var y=Math.floor(a);return y+(y===1?' anno':' anni')}
function url(u){return /^https?:\/\//i.test(u)?u:'https://'+u}
function render(){
var q=$('q').value.toLowerCase(),f=$('f').value,o=$('o').value;
var l=data.filter(function(s){var t=[s.name,s.rev,s.use,s.place,s.maker].join(' ').toLowerCase();return t.indexOf(q)>-1&&(f==='all'||(f==='warn')===isWarn(s))});
l.sort(function(a,b){if(o==='date')return (a.date||'').localeCompare(b.date||'');var k=o==='place'?'place':'name';return (a[k]||'').localeCompare(b[k]||'','it')});
$('n1').textContent=data.length;$('n2').textContent=data.filter(isWarn).length;
$('list').innerHTML=l.length?l.map(function(s){var w=isWarn(s);
var link=s.web?'<a class="btn s" target="_blank" rel="noopener" href="'+esc(url(s.web))+'">Apri sito</a>':'<a class="btn s" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(s.name+' '+(s.maker||'')+' scheda di sicurezza SDS')+'">Cerca online</a>';
return '<div class="card'+(w?' warn':'')+'"><h3>'+esc(s.name)+'</h3><div class="tags"><span class="tag">'+esc(s.rev||'Rev. n/d')+'</span><span class="tag '+(w?'wa':'ok')+'">'+fmt(s.date)+' · '+ageTxt(s.date)+'</span></div>'
+(w?'<div class="row" style="color:var(--wa)">⚠ Controlla se è uscita una nuova versione</div>':'')
+'<div class="row"><i>Utilizzato per</i>'+esc(s.use||'—')+'</div><div class="row"><i>Dove si trova</i>'+esc(s.place||'—')+'</div><div class="row"><i>Fabbricante</i>'+esc(s.maker||'—')+'</div>'
+'<div class="acts">'+(s.pdf?'<a class="btn s p" target="_blank" rel="noopener" href="/_blob/'+esc(s.pdf.id)+'">📄 Apri PDF</a>':'')+link+'<button class="btn s" data-e="'+s.id+'">Modifica</button><button class="btn s d" data-x="'+s.id+'">Elimina</button></div></div>'}).join(''):'<div class="empty">Nessuna scheda. Premi “+ Nuova scheda” per iniziare.</div>'}
function openForm(id){editId=id;var s=data.filter(function(x){return x.id===id})[0]||{};
$('dt').textContent=id?'Modifica scheda':'Nuova scheda';
$('fn').value=s.name||'';$('fv').value=s.rev||'';$('fd').value=s.date||new Date().toISOString().slice(0,10);$('fu').value=s.use||'';$('fp').value=s.place||'';$('fm').value=s.maker||'';$('fw').value=s.web||'';pdfCur=s.pdf||null;$('fpdf').value='';updPdf();$('dlg').showModal()}
$('add').onclick=function(){openForm(null)};$('c1').onclick=function(){$('dlg').close()};
$('s1').onclick=async function(){var n=$('fn').value.trim(),d=$('fd').value;if(!n||!d){$('fn').reportValidity();$('fd').reportValidity();return}
var r={id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,rev:$('fv').value.trim(),date:d,use:$('fu').value.trim(),place:$('fp').value.trim(),maker:$('fm').value.trim(),web:$('fw').value.trim(),pdf:pdfCur};
var fl=$('fpdf').files&&$('fpdf').files[0];if(fl&&assets){try{$('s1').disabled=true;$('s1').textContent='Carico il PDF…';var u=await assets.upload(fl);r.pdf={id:u.id,name:fl.name}}catch(e){$('pn').textContent='Caricamento non riuscito: '+((e&&e.message)||'riprova')+'. La scheda non è stata salvata.';$('s1').disabled=false;$('s1').textContent='Salva';return}$('s1').disabled=false;$('s1').textContent='Salva'}if(editId)data=data.map(function(x){return x.id===editId?r:x});else data.push(r);save();$('dlg').close();render()};
$('list').onclick=function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.e)openForm(b.dataset.e);
if(b.dataset.x){if(b.dataset.arm){data=data.filter(function(x){return x.id!==b.dataset.x});save();render()}else{b.dataset.arm=1;b.textContent='Confermi?';setTimeout(function(){b.dataset.arm='';b.textContent='Elimina'},3000)}}};
['q','f','o'].forEach(function(i){$(i).oninput=render});
$('y').onchange=function(){yrs=+$('y').value;save();render()};
function json(){return JSON.stringify({app:'sds',esportato:new Date().toISOString(),soglia_anni:yrs,schede:data},null,1)}
$('bk').onclick=function(){$('bt').value=json();$('bm').textContent='';$('bd').showModal()};
$('bx').onclick=function(){$('bd').close()};
$('bc').onclick=function(){$('bt').select();try{navigator.clipboard.writeText($('bt').value).then(function(){$('bm').textContent='Copiato negli appunti.'},function(){document.execCommand('copy');$('bm').textContent='Copiato.'})}catch(e){document.execCommand('copy');$('bm').textContent='Copiato.'}};
$('bdl').onclick=function(){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('bt').value],{type:'application/json'}));a.download='backup-sds-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();$('bm').textContent='Se il file non parte, usa “Copia”.'}catch(e){$('bm').textContent='Download non disponibile: usa “Copia”.'}};
function restore(t){try{var o=JSON.parse(t),l=Array.isArray(o)?o:o.schede;if(!Array.isArray(l))throw 0;data=l.map(function(s){s.id=s.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6);return s});if(o.soglia_anni){yrs=+o.soglia_anni;$('y').value=yrs}save();render();$('bm').textContent='Ripristinate '+data.length+' schede.'}catch(e){$('bm').textContent='Backup non valido.'}}
$('br').onclick=function(){restore($('bt').value)};
$('bf').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('bt').value=r.result;restore(r.result)};r.readAsText(f)};
var assets=null,pdfCur=null;
function updPdf(){$('pw').hidden=!assets;$('pn').textContent=pdfCur?'PDF collegato: '+pdfCur.name+' (scegli un file per sostituirlo)':'Nessun PDF caricato (max 20 MB).';$('prm').hidden=!pdfCur}
$('prm').onclick=function(){pdfCur=null;updPdf()};
try{claude.use('assets').then(function(a){assets=a;updPdf()},function(){})}catch(e){}
var HOME_LINK='https://apps.powerapps.com/play/e/default-c16e514b-893e-4a01-9a30-b8fef514a650/a/7d09e9b8-80d7-4289-8177-315e883dc6f0?tenantId=c16e514b-893e-4a01-9a30-b8fef514a650&hint=83de810f-aed1-424e-9508-763f8c564cd6&sourcetime=1791037994763&screen=Home_pc';
(function(){var a=$('home');if(!HOME_LINK){a.removeAttribute('href');return}var h=HOME_LINK,ok=/^(mailto:|https?:)/i.test(h);if(!ok)h=h.indexOf('@')>0?'mailto:'+h:'https://'+h;a.href=h;a.target='_blank';a.rel='noopener'})();
load();$('y').value=yrs;render();
</script>
</body>
</html>
